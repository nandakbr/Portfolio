<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FAF9F4"/>
  <!-- Color swatch row -->
  <rect x="24" y="24" width="94" height="94" rx="10" fill="#02284F"/>
  <rect x="126" y="24" width="94" height="94" rx="10" fill="#038FDD"/>
  <rect x="228" y="24" width="94" height="94" rx="10" fill="#79D4FE"/>
  <rect x="330" y="24" width="46" height="94" rx="10" fill="#CC443B"/>
  <!-- Typography sample -->
  <text x="24" y="168" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#0F2444">Aa</text>
  <text x="110" y="160" font-family="Inter, sans-serif" font-size="13" fill="#8692A1" letter-spacing="1">GEIST · TYPE SCALE</text>
  <text x="110" y="178" font-family="Inter, sans-serif" font-size="13" fill="#8692A1" letter-spacing="1">44 / 32 / 24 / 16 / 14 / 12</text>
  <!-- Divider -->
  <rect x="24" y="200" width="352" height="1" fill="#DFE5ED"/>
  <!-- Button variants row -->
  <rect x="24" y="224" width="86" height="34" rx="17" fill="#0F2444"/>
  <text x="67" y="246" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">Primary</text>
  <rect x="118" y="224" width="98" height="34" rx="17" fill="#FFFFFF" stroke="#DFE5ED"/>
  <text x="167" y="246" font-family="Inter, sans-serif" font-size="11" fill="#0F2444" text-anchor="middle" font-weight="600">Secondary</text>
  <rect x="224" y="224" width="70" height="34" rx="17" fill="#F1F3F6"/>
  <text x="259" y="246" font-family="Inter, sans-serif" font-size="11" fill="#AFB7C1" text-anchor="middle" font-weight="600">Ghost</text>
  <!-- Form input row -->
  <rect x="24" y="276" width="168" height="38" rx="8" fill="#FFFFFF" stroke="#8692A1"/>
  <text x="36" y="300" font-family="Inter, sans-serif" font-size="12" fill="#AFB7C1">Enter value...</text>
  <rect x="200" y="276" width="176" height="38" rx="8" fill="#FFFFFF" stroke="#8692A1"/>
  <text x="212" y="300" font-family="Inter, sans-serif" font-size="12" fill="#0F2444">Select option</text>
  <path d="M352 292 l6 6 l6 -6" stroke="#8692A1" stroke-width="1.6" fill="none"/>
  <!-- Nav / sidebar strip -->
  <rect x="24" y="330" width="56" height="46" rx="12" fill="#F9FAFC" stroke="#DFE5ED"/>
  <circle cx="52" cy="346" r="4" fill="#038FDD"/>
  <rect x="42" y="358" width="20" height="3" rx="1.5" fill="#DFE5ED"/>
  <rect x="42" y="365" width="20" height="3" rx="1.5" fill="#DFE5ED"/>
  <!-- status dots -->
  <circle cx="320" cy="348" r="7" fill="#27B45E"/>
  <circle cx="344" cy="348" r="7" fill="#FA8C16"/>
  <circle cx="368" cy="348" r="7" fill="#CC443B"/>
</svg>
